name: Verify portfolio and application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Showcase, frontend and publication guards
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check tracked files for secrets and artifacts
        run: |
          python3 -m unittest discover -s scripts/ci -p 'test_*.py'
          python3 scripts/ci/check_publication.py
          git diff --check
      - name: Verify independent static bundle
        run: |
          unset BELSEN_APP_URL BELSEN_APP_VERIFIED BELSEN_SOURCE_PUBLIC
          node --test showcase/build.test.mjs
          node showcase/build.mjs
      - name: Install locked frontend test tools
        working-directory: frontend
        run: npm ci
      - name: Verify frontend
        working-directory: frontend
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build
          npm audit --omit=dev
          npm audit
      - name: Install Chromium
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Check desktop, mobile and accessibility
        working-directory: frontend
        run: npx --no-install playwright test --config playwright.showcase.config.ts
      - name: Confirm generated output stays untracked
        run: git diff --exit-code

  backend:
    name: Java 21 and PostgreSQL verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Build React assets for the production JAR
        working-directory: frontend
        run: npm ci && npm run build
      - name: Require Docker for real PostgreSQL tests
        run: docker info
      - name: Verify and package with Maven Wrapper
        env:
          MVNW_VERBOSE: 'true'
        run: ./backend/mvnw -B -ntp -f backend/pom.xml -Pspa clean verify
      - name: Confirm generated output stays untracked
        run: git diff --exit-code
