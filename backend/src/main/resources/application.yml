spring:
  application:
    name: belsen-ai
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: true
  web:
    resources:
      add-mappings: false
  session:
    timeout: ${BELSEN_SESSION_TIMEOUT:30m}
    jdbc:
      initialize-schema: never
server:
  port: ${BELSEN_SERVER_PORT:8081}
  forward-headers-strategy: none
  servlet:
    session:
      cookie:
        name: BELSEN_SESSION
        http-only: true
        secure: true
        same-site: lax
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

belsen:
  google:
    enabled: ${BELSEN_GOOGLE_ENABLED:false}
    client-id: ${BELSEN_GOOGLE_CLIENT_ID:}
    client-secret: ${BELSEN_GOOGLE_CLIENT_SECRET:}
  coach:
    enabled: ${BELSEN_COACH_ENABLED:false}
    api-key: ${BELSEN_COACH_API_KEY:}
    free-plan-confirmed: ${BELSEN_COACH_FREE_PLAN_CONFIRMED:false}
    privacy-reviewed: ${BELSEN_COACH_PRIVACY_REVIEWED:false}
    model: ${BELSEN_COACH_MODEL:openai/gpt-oss-20b}
    endpoint: ${BELSEN_COACH_ENDPOINT:https://api.groq.com/openai/v1/chat/completions}
    connect-seconds: ${BELSEN_COACH_CONNECT_SECONDS:3}
    deadline-seconds: ${BELSEN_COACH_DEADLINE_SECONDS:15}
    max-input-bytes: ${BELSEN_COACH_MAX_INPUT_BYTES:12288}
    max-output-tokens: ${BELSEN_COACH_MAX_OUTPUT_TOKENS:512}
    strict-output: true
