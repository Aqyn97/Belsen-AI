# Local preparation only. Production use requires separate infrastructure/release approval.
name: belsen-ai-production

x-logs: &logs
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  postgres:
    image: postgres:17.11-bookworm
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    tmpfs:
      - /var/run/postgresql:size=16m,mode=3775
      - /tmp:size=64m,mode=1777
    restart: unless-stopped
    environment:
      POSTGRES_DB: belsen
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=peer
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    secrets:
      - postgres_admin_password
      - db_password
      - postgres_backup_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-belsen-roles.sql:ro
    command:
      - postgres
      - -c
      - max_connections=30
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - effective_cache_size=512MB
      - -c
      - max_wal_size=512MB
      - -c
      - min_wal_size=128MB
      - -c
      - password_encryption=scram-sha-256
    networks: [data]
    shm_size: 128m
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 0.75
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, 'PGPASSWORD="$$(cat /run/secrets/postgres_backup_password)" psql -h127.0.0.1 -U belsen_backup -d belsen -Atqc "SELECT 1" >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 40s
    logging: *logs

  app:
    image: ${BELSEN_APP_IMAGE:?Set a reviewed immutable application image identity}
    restart: unless-stopped
    user: '10001:10001'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=64m,mode=1777
    secrets:
      - source: db_password
        target: SPRING_DATASOURCE_PASSWORD
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/belsen
      SPRING_DATASOURCE_USERNAME: belsen_app
      BELSEN_PUBLIC_BASE_URL: https://${BELSEN_DOMAIN:?Set the approved domain}
      BELSEN_BIND_ADDRESS: 0.0.0.0
      BELSEN_SERVER_PORT: '8081'
      BELSEN_TLS_ENABLED: 'false'
      BELSEN_FORWARD_HEADERS_STRATEGY: native
      BELSEN_TRUSTED_PROXY_REGEX: '172[.]30[.]40[.]2'
      BELSEN_REGISTRATION_ENABLED: 'false'
      BELSEN_GOOGLE_ENABLED: 'false'
      BELSEN_COACH_ENABLED: 'false'
      BELSEN_DB_POOL_MAX: '8'
      BELSEN_DB_POOL_MIN: '2'
      SERVER_TOMCAT_THREADS_MAX: '50'
      SERVER_TOMCAT_THREADS_MIN_SPARE: '5'
      SERVER_TOMCAT_MAX_CONNECTIONS: '200'
      SERVER_TOMCAT_ACCEPT_COUNT: '50'
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx768m -XX:+ExitOnOutOfMemoryError -XX:ActiveProcessorCount=2
    networks:
      proxy:
        ipv4_address: 172.30.40.3
      data: {}
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: 1.25
    pids_limit: 160
    healthcheck:
      # TCP liveness only; startup binds after Flyway/Hibernate. HTTPS smoke is via Caddy.
      test: [CMD, bash, -c, 'exec 3<>/dev/tcp/127.0.0.1/8081']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    stop_grace_period: 40s
    logging: *logs

  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    user: '10001:10001'
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    environment:
      BELSEN_DOMAIN: ${BELSEN_DOMAIN:?Set the approved domain}
      BELSEN_PUBLIC_HOST: ${BELSEN_DOMAIN:?Set the approved domain}
      BELSEN_ACME_EMAIL: ${BELSEN_ACME_EMAIL:?Set the certificate contact email}
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./proxy.caddy:/etc/caddy/proxy.caddy:ro
      - caddy_data:/data
    tmpfs:
      - /config:size=16m,uid=10001,gid=10001,mode=0700
      - /tmp:size=16m,mode=1777
    networks:
      public: {}
      proxy:
        ipv4_address: 172.30.40.2
    depends_on:
      app: {condition: service_healthy}
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    pids_limit: 64
    healthcheck:
      # Private upstream readiness; public TLS is checked separately with trusted certificates.
      test: [CMD, wget, -q, -O, /dev/null, '--header=X-Forwarded-Proto: https', http://app:8081/api/v1/health]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    stop_grace_period: 40s
    logging: *logs

secrets:
  postgres_admin_password:
    file: ${BELSEN_POSTGRES_ADMIN_PASSWORD_FILE:?Set the protected admin password file path}
  db_password:
    file: ${BELSEN_DB_PASSWORD_FILE:?Set the protected app password file path}
  postgres_backup_password:
    file: ${BELSEN_POSTGRES_BACKUP_PASSWORD_FILE:?Set the protected backup password file path}

networks:
  public: {}
  proxy:
    internal: true
    ipam:
      config: [{subnet: 172.30.40.0/28}]
  data:
    internal: true

volumes:
  postgres_data: {}
  caddy_data: {}
